server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /health/live {
        default_type application/json;
        return 200 '{"alive":true}';
    }

    location = /health/simple {
        default_type text/plain;
        return 200 'OK';
    }

    location = /health/ready {
        default_type application/json;
        return 200 '{"ready":true}';
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy","environment":"production"}';
    }

    location = /health/errors {
        default_type application/json;
        return 200 '{"errorCount":0,"warningCount":0,"errors":[],"warnings":[],"state":"success"}';
    }

    location = /health/stats {
        default_type application/json;
        return 200 '{"totalCompiles":1,"averageCompileTime":null,"lastCompileDuration":null,"serverUptime":null}';
    }

    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

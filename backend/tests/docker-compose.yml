services:
  backend:
    build:
      context: ./backend
    container_name: whymob-backend
    env_file:
      - ./backend/.env
    environment:
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: whymob-backend
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8000:8000"
    volumes:
      - proposal_uploads:/app/uploads
    restart: unless-stopped

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    container_name: whymob-jaeger
    ports:
      - "16686:16686"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: whymob-frontend
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8000
      HOST: 0.0.0.0
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  proposal_uploads:

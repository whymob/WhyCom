services:
  backend:
    env_file:
      - ./backend/.env.production
    depends_on:
      - mongo

  frontend:
    environment:
      REACT_APP_BACKEND_URL: http://10.0.0.41:8000
    ports:
      - "80:80"
    depends_on:
      - backend

  mongo:
    image: mongo:7
    container_name: whymob-mongo
    environment:
      MONGO_INITDB_DATABASE: whymob_prod
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  proposal_uploads:

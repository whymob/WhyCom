services:
  backend:
    build:
      context: ./backend
    container_name: whymob-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - proposal_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: whymob-frontend
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  proposal_uploads:

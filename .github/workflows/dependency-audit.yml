name: Dependency audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked backend development dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Audit backend runtime dependencies
        run: pip-audit --requirement backend/requirements.txt
      - name: Audit backend development dependencies
        run: pip-audit --requirement backend/requirements-dev.txt
      - name: Run isolated backend unit tests
        working-directory: backend
        run: python -m pytest tests/test_annual_billing_filters.py tests/test_client_invoice_scope.py

  e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: whycom_ci_e2e
      JWT_SECRET: whycom-ci-only-secret-not-for-any-environment
      ENABLE_STARTUP_SEED: "true"
      SCHEDULER_ENABLED: "false"
      RESEND_API_KEY: ""
      CORS_ORIGINS: http://127.0.0.1:3000
      VITE_BACKEND_URL: http://127.0.0.1:8000
      ENABLE_HEALTH_CHECK: "true"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked backend runtime dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Start backend with disposable seeded database
        working-directory: backend
        run: |
          python -m uvicorn server:app --host 0.0.0.0 --port 8000 > /tmp/whycom-backend.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/whycom-backend.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run start -- --host 0.0.0.0 > /tmp/whycom-frontend.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health/ready | grep -q '"ready":true'; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/whycom-frontend.log
          exit 1
      - name: Run read-only Playwright smoke flow
        working-directory: frontend
        run: npm run test:e2e
      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/whycom-backend.log
      - name: Show frontend log on failure
        if: failure()
        run: cat /tmp/whycom-frontend.log

services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    command: ["--config", "/etc/whymob-jaeger.yaml"]
    volumes:
      - ./observability/jaeger/config-badger-production.yaml:/etc/whymob-jaeger.yaml:ro
      - jaeger_data:/badger
    depends_on:
      jaeger-storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  jaeger-storage-init:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh"]
    command: ["-c", "mkdir -p /badger/keys /badger/values && chown -R 10001:0 /badger/keys /badger/values"]
    volumes:
      - jaeger_data:/badger
    restart: "no"

  backend:
    env_file:
      - ./backend/.env.production
    environment:
      ALLOW_PROPOSAL_ATTACHMENT_AFTER_ORDER: "true"
    depends_on:
      - mongo

  frontend:
    environment:
      REACT_APP_BACKEND_URL: http://whycrm.oramix.local:8000
      HOST: 0.0.0.0
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      REACT_APP_ALLOW_PROPOSAL_ATTACHMENT_AFTER_ORDER: "true"
    ports:
      - "80:3000"
    depends_on:
      - backend

  mongo:
    image: mongo:7
    container_name: whymob-mongo
    environment:
      MONGO_INITDB_DATABASE: whymob_prod
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  proposal_uploads:
  jaeger_data:

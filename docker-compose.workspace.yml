name: whycom-workspace

services:
  mongo-workspace:
    image: mongo:7
    container_name: whymob-workspace-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_workspace_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"

  backend-workspace:
    build:
      context: ./backend
    container_name: whymob-workspace-backend
    env_file:
      - ./backend/.env.workspace
    environment:
      MONGO_URL: mongodb://mongo-workspace:27017
      DB_NAME: whycom_workspace_dev
      ALLOW_PROPOSAL_ATTACHMENT_AFTER_ORDER: "true"
      WORKSPACE_DEMO_DATA: "false"
      FUNNEL_DEMO_DATA: "true"
      ENABLE_STARTUP_SEED: "true"
      # O ambiente de validação não deve gerar e-mails externos.
      RESEND_API_KEY: ""
    ports:
      - "8010:8000"
    volumes:
      - proposal_uploads_workspace:/app/uploads-workspace-dev
    restart: "no"
    depends_on:
      mongo-workspace:
        condition: service_healthy

  frontend-workspace:
    build:
      context: ./frontend
    container_name: whymob-workspace-frontend
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8010
      REACT_APP_ALLOW_PROPOSAL_ATTACHMENT_AFTER_ORDER: "true"
    ports:
      - "3010:80"
    depends_on:
      - backend-workspace
    restart: "no"

volumes:
  mongo_workspace_data:
  proposal_uploads_workspace:
